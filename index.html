<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISU Soundbox Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Portal Redesign CSS -->
    <link href="css/portal.css?v=2" rel="stylesheet">
</head>
<body>

    <!-- Header Section -->
    <header class="portal-header">
        <div class="d-flex align-items-center gap-3">
            <a href="index.html" class="portal-brand">
                <span class="portal-logo-text">iServe<span>U</span></span>
                <span class="portal-subtitle">Soundbox Portal</span>
            </a>
            <button class="hamburger-btn" type="button" aria-label="Toggle navigation" id="sidebarToggle">
                <i class="bi bi-list text-dark fs-4"></i>
            </button>
        </div>
        
        <div class="d-flex align-items-center gap-3">
            <!-- Bank Dropdown Pill -->
            <a href="#" class="bank-selector-pill">
                <i class="bi bi-bank"></i>
                <span>Bank of Baroda</span>
                <i class="bi bi-chevron-down ms-1" style="font-size: 0.75rem;"></i>
            </a>
            
            <!-- Profile Avatar Icon -->
            <button class="profile-avatar-btn" type="button" aria-label="User profile">
                <i class="bi bi-person-fill text-white"></i>
            </button>
        </div>
    </header>

    <div class="portal-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="portal-sidebar">
            <ul class="portal-sidebar-nav">
                <!-- Dashboard Link -->
                <li class="portal-nav-item">
                    <a href="index.html" class="portal-nav-link active" id="nav-dashboard">
                        <i class="bi bi-grid-fill portal-nav-icon"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                
                <!-- Master TMS Section (Collapsible) -->
                <li class="portal-nav-item">
                    <button class="category-header-btn" type="button" data-bs-toggle="collapse" data-bs-target="#tmsSubmenu" aria-expanded="true">
                        <span>
                            <i class="bi bi-clipboard-data-fill me-2" style="font-size: 1rem; vertical-align: middle;"></i>
                            Master TMS
                        </span>
                        <i class="bi bi-chevron-up chevron-indicator"></i>
                    </button>
                    <div class="collapse show" id="tmsSubmenu">
                        <ul class="submenu-nav">
                            <li>
                                <a href="pages/merchant-denial.html" class="portal-nav-link" id="nav-merchant-denial">
                                    <i class="bi bi-file-earmark-x-fill portal-nav-icon"></i>
                                    <span>Merchant Denial Upload</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </li>

                <!-- Pre-QC Modules Section (Collapsible) -->
                <li class="portal-nav-item">
                    <button class="category-header-btn" type="button" data-bs-toggle="collapse" data-bs-target="#preQcSubmenu" aria-expanded="true">
                        <span>
                            <i class="bi bi-shield-check-fill me-2" style="font-size: 1rem; vertical-align: middle;"></i>
                            Pre-QC Modules
                        </span>
                        <i class="bi bi-chevron-up chevron-indicator"></i>
                    </button>
                    <div class="collapse show" id="preQcSubmenu">
                        <ul class="submenu-nav">
                            <li>
                                <a href="#" class="portal-nav-link disabled-sidebar-item">
                                    <i class="bi bi-clipboard-fill portal-nav-icon"></i>
                                    <span>Device Mapping</span>
                                </a>
                            </li>
                            <li>
                                <a href="#" class="portal-nav-link disabled-sidebar-item">
                                    <i class="bi bi-gear-fill portal-nav-icon"></i>
                                    <span>Device Installation</span>
                                </a>
                            </li>
                            <li>
                                <a href="pages/reports.html" class="portal-nav-link" id="nav-delivery-report">
                                    <i class="bi bi-file-earmark-arrow-up-fill portal-nav-icon"></i>
                                    <span>Delivery Report Upload</span>
                                </a>
                            </li>
                            <li>
                                <a href="#" class="portal-nav-link disabled-sidebar-item">
                                    <i class="bi bi-arrow-left-right portal-nav-icon"></i>
                                    <span>RTO</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </li>

                <!-- Reports Section (Collapsible) -->
                <li class="portal-nav-item">
                    <button class="category-header-btn" type="button" data-bs-toggle="collapse" data-bs-target="#reportsSubmenu" aria-expanded="true">
                        <span>
                            <i class="bi bi-graph-up-arrow me-2" style="font-size: 1rem; vertical-align: middle;"></i>
                            Reports
                        </span>
                        <i class="bi bi-chevron-up chevron-indicator"></i>
                    </button>
                    <div class="collapse show" id="reportsSubmenu">
                        <ul class="submenu-nav">
                            <li>
                                <a href="#" class="portal-nav-link disabled-sidebar-item">
                                    <i class="bi bi-gemini portal-nav-icon"></i>
                                    <span>Device QC Reports</span>
                                </a>
                            </li>
                            <li>
                                <a href="#" class="portal-nav-link disabled-sidebar-item">
                                    <i class="bi bi-file-earmark-medical-fill portal-nav-icon"></i>
                                    <span>Device Installation Reports</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <main class="portal-main-content">
            <h1 class="mb-4" style="color: var(--portal-text-dark); font-weight: 700; font-size: 1.8rem;">Dashboard Overview</h1>
            
            <div class="row g-4 mt-2">
                <!-- Merchant Denial Module Card -->
                <div class="col-12 col-md-6 col-lg-4">
                    <a href="pages/merchant-denial.html" class="dashboard-module-card functional-card" id="merchant-denial-card-btn" style="background-color: #ffffff; border: 1px solid var(--portal-border); border-radius: 16px; padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.02); height: 200px;">
                        <div style="width: 64px; height: 64px; border-radius: 50%; background-color: #e0f2fe; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; color: #00b4d8; font-size: 1.8rem;">
                            <i class="bi bi-file-earmark-x-fill"></i>
                        </div>
                        <span style="font-weight: 700; color: #1e293b; font-size: 1.1rem; text-align: center;">Merchant Denial Report</span>
                    </a>
                </div>

                <!-- Central Ops Card (Dummy, disabled) -->
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="dashboard-module-card dummy-card" id="central-ops-btn" style="background-color: #ffffff; border: 1px solid var(--portal-border); border-radius: 16px; padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.02); height: 200px; opacity: 0.7; cursor: not-allowed;">
                        <div style="width: 64px; height: 64px; border-radius: 50%; background-color: #f1f5f9; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; color: #64748b; font-size: 1.8rem;">
                            <i class="bi bi-megaphone-fill"></i>
                        </div>
                        <span style="font-weight: 700; color: #64748b; font-size: 1.1rem; text-align: center;">Central Ops</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Collapsible sidebar chevron toggle
        $('.category-header-btn').on('click', function() {
            const indicator = $(this).find('.chevron-indicator');
            setTimeout(() => {
                const isExpanded = $(this).attr('aria-expanded') === 'true';
                if (isExpanded) {
                    indicator.removeClass('bi-chevron-down').addClass('bi-chevron-up');
                } else {
                    indicator.removeClass('bi-chevron-up').addClass('bi-chevron-down');
                }
            }, 100);
        });

        // Mobile toggle
        $('#sidebarToggle').on('click', function() {
            $('.portal-sidebar').toggleClass('show');
        });
    </script>
</body>
</html>
