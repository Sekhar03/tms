<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Denial - ISU Soundbox Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Portal Redesign CSS -->
    <link href="../css/portal.css?v=2" rel="stylesheet">
</head>
<body>

    <!-- Header Section -->
    <header class="portal-header">
        <div class="d-flex align-items-center gap-3">
            <a href="../index.html" class="portal-brand">
                <span class="portal-logo-text">iServe<span>U</span></span>
                <span class="portal-subtitle">Soundbox Portal</span>
            </a>
            <button class="hamburger-btn" type="button" aria-label="Toggle navigation" id="sidebarToggle">
                <i class="bi bi-list text-dark fs-4"></i>
            </button>
        </div>
        
        <div class="d-flex align-items-center gap-3">
            <!-- Bank Dropdown Pill -->
            <a href="#" class="bank-selector-pill">
                <i class="bi bi-bank"></i>
                <span>Bank of Baroda</span>
                <i class="bi bi-chevron-down ms-1" style="font-size: 0.75rem;"></i>
            </a>
            
            <!-- Profile Avatar Icon -->
            <button class="profile-avatar-btn" type="button" aria-label="User profile">
                <i class="bi bi-person-fill text-white"></i>
            </button>
        </div>
    </header>

    <div class="portal-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="portal-sidebar">
            <ul class="portal-sidebar-nav">
                <!-- Dashboard Link -->
                <li class="portal-nav-item">
                    <a href="../index.html" class="portal-nav-link" id="nav-dashboard">
                        <i class="bi bi-grid-fill portal-nav-icon"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                
                <!-- Master TMS Section (Collapsible) -->
                <li class="portal-nav-item">
                    <button class="category-header-btn" type="button" data-bs-toggle="collapse" data-bs-target="#tmsSubmenu" aria-expanded="true">
                        <span>
                            <i class="bi bi-clipboard-data-fill me-2" style="font-size: 1rem; vertical-align: middle;"></i>
                            Master TMS
                        </span>
                        <i class="bi bi-chevron-up chevron-indicator"></i>
                    </button>
                    <div class="collapse show" id="tmsSubmenu">
                        <ul class="submenu-nav">
                            <li>
                                <a href="merchant-denial.html" class="portal-nav-link active" id="nav-merchant-denial">
                                    <i class="bi bi-file-earmark-x-fill portal-nav-icon"></i>
                                    <span>Merchant Denial Upload</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </li>

                <!-- Pre-QC Modules Section (Collapsible) -->
                <li class="portal-nav-item">
                    <button class="category-header-btn" type="button" data-bs-toggle="collapse" data-bs-target="#preQcSubmenu" aria-expanded="true">
                        <span>
                            <i class="bi bi-shield-check-fill me-2" style="font-size: 1rem; vertical-align: middle;"></i>
                            Pre-QC Modules
                        </span>
                        <i class="bi bi-chevron-up chevron-indicator"></i>
                    </button>
                    <div class="collapse show" id="preQcSubmenu">
                        <ul class="submenu-nav">
                            <li>
                                <a href="#" class="portal-nav-link disabled-sidebar-item">
                                    <i class="bi bi-clipboard-fill portal-nav-icon"></i>
                                    <span>Device Mapping</span>
                                </a>
                            </li>
                            <li>
                                <a href="#" class="portal-nav-link disabled-sidebar-item">
                                    <i class="bi bi-gear-fill portal-nav-icon"></i>
                                    <span>Device Installation</span>
                                </a>
                            </li>
                            <li>
                                <a href="reports.html" class="portal-nav-link" id="nav-delivery-report">
                                    <i class="bi bi-file-earmark-arrow-up-fill portal-nav-icon"></i>
                                    <span>Delivery Report Upload</span>
                                </a>
                            </li>
                            <li>
                                <a href="#" class="portal-nav-link disabled-sidebar-item">
                                    <i class="bi bi-arrow-left-right portal-nav-icon"></i>
                                    <span>RTO</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </li>

                <!-- Reports Section (Collapsible) -->
                <li class="portal-nav-item">
                    <button class="category-header-btn" type="button" data-bs-toggle="collapse" data-bs-target="#reportsSubmenu" aria-expanded="true">
                        <span>
                            <i class="bi bi-graph-up-arrow me-2" style="font-size: 1rem; vertical-align: middle;"></i>
                            Reports
                        </span>
                        <i class="bi bi-chevron-up chevron-indicator"></i>
                    </button>
                    <div class="collapse show" id="reportsSubmenu">
                        <ul class="submenu-nav">
                            <li>
                                <a href="#" class="portal-nav-link disabled-sidebar-item">
                                    <i class="bi bi-gemini portal-nav-icon"></i>
                                    <span>Device QC Reports</span>
                                </a>
                            </li>
                            <li>
                                <a href="#" class="portal-nav-link disabled-sidebar-item">
                                    <i class="bi bi-file-earmark-medical-fill portal-nav-icon"></i>
                                    <span>Device Installation Reports</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <main class="portal-main-content">
            <!-- Custom Portal Card matching screenshot -->
            <div class="portal-card">
                <div class="portal-card-header">
                    <h2 class="portal-card-title">Upload Merchant Denial Reports</h2>
                    
                    <!-- Download Link exactly like screenshot (teal underlined, green/teal circle with down arrow) -->
                    <button type="button" class="download-sample-btn" id="download-sample-btn">
                        <span class="download-icon-circle"><i class="bi bi-download"></i></span>
                        <span>Download Sample Excel Sheet</span>
                    </button>
                </div>

                <!-- Form Layout aligned side-by-side horizontally -->
                <form id="tmsInventoryForm" novalidate>
                    <div class="form-horizontal-row">
                        <!-- Select Bank dropdown -->
                        <div style="flex: 1; min-width: 250px;">
                            <label for="bankSelect" class="form-label-small">Select Service Aggregator</label>
                            <select class="form-select-custom" id="bankSelect" required>
                                <option value="" selected disabled>Select Bank</option>
                                <option value="HDFC Bank">HDFC Bank</option>
                                <option value="ICICI Bank">ICICI Bank</option>
                                <option value="Axis Bank">Axis Bank</option>
                                <option value="SBI">SBI</option>
                                <option value="Yes Bank">Yes Bank</option>
                                <option value="Kotak Bank">Kotak Bank</option>
                            </select>
                            <div class="invalid-feedback">Bank is required.</div>
                        </div>

                        <!-- Upload File Input styled exactly -->
                        <div style="flex: 1.5; min-width: 300px;">
                            <label class="form-label-small">Upload Excel Sheet</label>
                            <div class="file-upload-group">
                                <span class="file-upload-icon"><i class="bi bi-cloud-upload-fill"></i></span>
                                <input type="text" id="fileNameDisplay" class="file-upload-text" placeholder="Choose .xlsx file" readonly required>
                                <button class="btn-browse-custom" type="button" id="browseBtn">Browse</button>
                            </div>
                            <input type="file" id="fileInput" name="reportFile" class="d-none" accept=".xls,.xlsx,.csv">
                            <div class="text-danger small mt-1 d-none" id="file-error-message">File is required</div>
                        </div>

                        <!-- Upload Button -->
                        <div style="flex: 0.5; min-width: 150px;">
                            <button type="submit" class="btn-upload-action">
                                <i class="bi bi-cloud-upload-fill"></i> Upload
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Success Modal Popup -->
    <div id="successModalOverlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.4); backdrop-filter:blur(4px); z-index:2000; align-items:center; justify-content:center;">
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Application JS -->
    <script src="../js/merchant-denial.js?v=2"></script>
    
    <script>
        // Collapsible sidebar chevron toggle
        $('.category-header-btn').on('click', function() {
            const indicator = $(this).find('.chevron-indicator');
            setTimeout(() => {
                const isExpanded = $(this).attr('aria-expanded') === 'true';
                if (isExpanded) {
                    indicator.removeClass('bi-chevron-down').addClass('bi-chevron-up');
                } else {
                    indicator.removeClass('bi-chevron-up').addClass('bi-chevron-down');
                }
            }, 100);
        });

        // Mobile toggle
        $('#sidebarToggle').on('click', function() {
            $('.portal-sidebar').toggleClass('show');
        });
    </script>
</body>
</html>
